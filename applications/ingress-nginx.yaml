apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: 'https://kubernetes.github.io/ingress-nginx'
    chart: ingress-nginx
    targetRevision: 4.12.1
    helm:
      valueFiles:
        - $values/ingress-nginx/values.yaml
  - repoURL: 'https://github.com/felipedsnt/descomplicando-gitops-no-kubernetes-argocd.git'
    targetRevision: feat/day2
    ref: values
  destination:
    namespace: ingress-nginx
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
   